<!DOCTYPE html>
<html lang="en">

<head>
    <html xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Principal</title>
    <style>
        table{
            border-collapse: collapse;
        }

        th,td{
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>

<body>
    <h1>Todos los Usuarios Registrados en la plataforma</h1>

    <table>
        <tr>
            <th>Nombre Usuario</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Fecha</th>
            <th>Categoria</th>
        </tr>
        <tr th:each=" usuario: ${usuario}">
            <!--<td th:object="${usuario}"></td> -->
            <td th:text="${usuario.nombreUsuario}"></td>
            <td th:text="${usuario.nombre}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.fecha}"></td>
            <td th:text="${usuario.categoria}"></td>
        </tr>
    </table>

    <a th:href="@{/inicio}" id="mensaje">Volver al inicio</a>
    <a th:href="@{/registro}" id="mensaje">Volver al registro</a>
</body>

</html>
