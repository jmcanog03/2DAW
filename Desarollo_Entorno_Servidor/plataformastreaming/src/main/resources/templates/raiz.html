<!DOCTYPE html>
<html lang="en">

<head>
    <html xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Principal</title>
</head>

<body>
    <h1>Todos los Usuarios Registrados en la plataforma</h1>

    <ul th:each=" usuario: ${usuario}">
        <li th:object="${usuario}"></li>
        <li th:text="${usuario.nombreusuario}"></li>
        <li th:text="${usuario.nombre}"></li>
        <li th:text="${usuario.email}"></li>
        <li th:text="${usuario.fecha}"></li>
        <li th:text="${usuario.categoria}"></li>

    </ul>
</body>

</html>
