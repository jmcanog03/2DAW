<!DOCTYPE html>
<html lang="en", xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragmento :: metadatos"></div>
</head>

<body>
    <header>

        <div th:replace="fragmento :: cabecera">

        </div>

    </header>


<body>

    <table id="tabla">

                <tr>
                    <td>ID</td>
                    <td>Nombre</td>
                    <td>Nacionalidad</td>
                    <td>Biografia</td>
                </tr>

                <tr th:each="autor: ${autorID}">
                    <td th:text="${autor.id}"></td>
                    <td th:text="${autor.nombre}"></td>
                    <td th:text="${autor.nacionalidad}"></td>
                    <td th:text="${autor.biografia}"></td>    
                </tr>
    </table>
     
</body>
</html>
