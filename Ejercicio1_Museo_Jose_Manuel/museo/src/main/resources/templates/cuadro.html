<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <html xmlns:th="http://www.thymeleaf.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/raiz.css}">
    <title>Cuadros</title>
</head>

<body>
            
    <table id="tabla">

                <tr>
                    <td>ID</td>
                    <td>Titulo</td>
                    <td>Estilo</td>
                    <td>Descripcion</td>
                    <td>anio</td>
                </tr>

                <tr th:each="cuadro: ${cuadros}">
                    <td th:text="${cuadro.id}"></td>
                    <td th:text="${cuadro.titulo}"></td>
                    <td th:text="${cuadro.estilo}"></td>
                    <td th:text="${cuadro.descripcion}"></td>
                    <td th:text="${cuadro.anio}"></td>       
                </tr>

    </table>
    
</body>

</html>
