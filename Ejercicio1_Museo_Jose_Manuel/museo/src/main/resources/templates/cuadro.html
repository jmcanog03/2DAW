<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <html xmlns:th="http://www.thymeleaf.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/cuadro.css">
    <title>Cuadros</title>
</head>

<body>
    <table>
        <tr th:each="cuadro: ${cuadros}">
            <td th:text="|Nombre del cuadro: ${cuadro.titulo}|" class="espacio"></td>
            <td th:text="|Estilo: ${cuadro.estilo}|" class="espacio"></td>
            <td th:text="|Decripcion: ${cuadro.descripcion}|" class="espacio"></td>
        </tr>
    </table>
</body>

</html>
