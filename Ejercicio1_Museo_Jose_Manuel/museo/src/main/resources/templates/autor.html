<!DOCTYPE html>
<html lang="en">

<head>
    <div th:replace="~{fragmento :: metadatos}"></div>
</head>

<body>
    <header>

        <div th:replace="~{fragmento :: cabecera}">

        </div>

    </header>

    <body>
        <br>
        <table id="tabla">

            <tr>
                <td>ID</td>
                <td>Nombre</td>
                <td>Nacionalidad</td>
                <td>Biografia</td>
            </tr>

            <tr th:each="autor: ${autores}"
            th:class="${autor.fallecimiento == null ? 'vivo' : 'fallecido'}">
                <td th:text="${autor.id}"></td>
                <td th:text="${autor.nombre}"></td>
                <td th:text="${autor.nacionalidad}"></td>
                <td th:text="${autor.biografia}"></td>
                <td><button><a id="btn-detalle" th:href="@{/autor/{id}(id=${autor.id})}">Detalle</a></button></td>
            </tr>

        </table>


        <footer>

            <div th:replace="~{fragmento :: pie}">

            </div>

        </footer>

    </body>

</html>
