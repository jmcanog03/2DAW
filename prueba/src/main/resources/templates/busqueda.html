<!DOCTYPE html>
<html lang="es" xmlns="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busqueda</title>

    <style>
        table {
            width: 100%;
            max-width: 900px;
            margin: 1.5rem auto;
            border-collapse: collapse;
            font-family: system-ui, sans-serif;
            font-size: 0.95rem;
        }

        th,
        td {
            padding: 0.7rem 1rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        thead th,
        tr:first-child th {
            background-color: #2c3e50;
            color: white;
        }

        tr:nth-child(even) td {
            background-color: #f5f7fa;
        }

        tr:hover td {
            background-color: #e8f0fe;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            padding: 0.4rem 0.9rem;
            border: none;
            border-radius: 4px;
            background-color: #dc2626;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #b91c1c;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>Titulo</th>
            <th>Plataforma</th>
            <th>Precio</th>
            <th>Anio</th>
            <th>Disponible</th>
        </tr>

        <tr th:each=" videojuego:${videojuegos}">

            <td>
                <a th:text="${videojuego.titulo}" th:href="@{/videojuegos/{id}(id = ${videojuego.id})}"></a>
            </td>
            <td th:text="${videojuego.plataforma}"></td>
            <td th:text="${videojuego.precio}"></td>
            <td th:text="${videojuego.anioLanzamiento}"></td>
            <td th:text="${videojuego.disponible}"></td>
        </tr>
    </table>
</body>

</html>
